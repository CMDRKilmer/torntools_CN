name: Create and Upload Beta

on:
    push:
        branches:
            - master
        paths:
            - "public/**"
            - "src/common/**"
            - "src/extension/**"
            - "package.json"
            - "wxt.config.*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    beta:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build and package extension
              run: |
                  bun run zip
                  mv .output/torntools-extension-*-chrome.zip torntools-chrome.zip
                  mv .output/torntools-extension-*-firefox.zip torntools-firefox.zip

            - name: Set Environment Variables
              run: |
                  echo "SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')" >> $GITHUB_ENV

            - name: Upload Betas
              env:
                  PG_TT_TOKEN: ${{ secrets.PG_TT_TOKEN }}
              run: |
                  # --fail-with-body 在非 2xx 时仍输出响应体,便于诊断 token/服务端问题。
                  curl --fail-with-body --show-error -X POST \
                      -H "X-API-KEY: $PG_TT_TOKEN" \
                      -F "branch=$SAFE_BRANCH" \
                      -F "editions=chrome" -F "files=@torntools-chrome.zip;type=application/zip" \
                      -F "editions=firefox" -F "files=@torntools-firefox.zip;type=application/zip" \
                      https://torntools.tornplayground.eu/api/beta-versions
